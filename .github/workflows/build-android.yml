name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App (Vite)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          echo "Building with API URL: $VITE_API_URL"
          npm run build

      - name: Initialize Android Project (Capacitor)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate Android Assets
        run: |
          # 1. Prepare and generate clean PNG master assets and Android resources
          node scripts/prepare-assets.cjs
          # 2. Run Capacitor assets generator (with fallback to prepare-assets)
          npx @capacitor/assets generate --android --assetPath assets/resources || true
          # 3. Ensure all Android mipmap icons and splash drawables are present
          node scripts/prepare-assets.cjs
          npx cap copy android
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTB-Cinema-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
